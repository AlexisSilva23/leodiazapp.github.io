<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Un mensaje para ti</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #fdf6f0;
      --card: #ffffff;
      --primary: #d9534f;
      --text: #333333;
      --muted: #666666;
      --success: #5cb85c;
      --warning: #f0ad4e;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 450px; }

    /* Pantallas */
    .screen { display: none; background: var(--card); border-radius: 20px; padding: 30px 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; animation: fadeIn 0.4s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Login con clave */
    input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 12px; font-size: 1rem; text-align: center; margin: 15px 0; outline: none; transition: all 0.3s ease; }
    input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(217, 83, 79, 0.1); }
    input[type="file"] { text-align: left; padding: 10px; cursor: pointer; }
    
    button { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: 600; border-radius: 30px; cursor: pointer; width: 100%; transition: all 0.3s ease; }
    button:hover:not(:disabled) { background: #c9302c; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(217, 83, 79, 0.3); }
    button:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }
    
    .error-msg { color: var(--primary); font-size: 0.9rem; margin-top: 10px; display: none; padding: 12px; background: rgba(217, 83, 79, 0.1); border-radius: 8px; border-left: 4px solid var(--primary); }
    .success-msg { color: var(--success); font-size: 0.9rem; margin-top: 10px; display: none; padding: 12px; background: rgba(92, 184, 92, 0.1); border-radius: 8px; border-left: 4px solid var(--success); }
    .warning-msg { color: var(--warning); font-size: 0.85rem; margin-top: 10px; display: none; }

    /* Contenido con Scroll vertical */
    #screen-content { text-align: left; background: transparent; box-shadow: none; padding: 0; }
    .note { background: var(--card); border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); }
    .note h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 10px; }
    .note p { color: var(--muted); line-height: 1.6; font-size: 1rem; white-space: pre-wrap; word-wrap: break-word; }

    /* Sección de Audio */
    .audio-section { background: var(--card); border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 40px; }
    .audio-section h2 { color: var(--primary); margin-bottom: 8px; }
    .audio-section p { color: var(--muted); font-size: 0.9rem; margin-bottom: 15px; }
    
    audio { width: 100%; margin-top: 15px; border-radius: 8px; }
    
    .audio-input-group { margin-bottom: 20px; text-align: left; }
    .audio-input-group label { display: block; font-weight: 600; color: var(--text); margin-bottom: 8px; font-size: 0.9rem; }
    .audio-input-group input[type="file"] { margin: 0; }

    /* Indicador de progreso */
    .progress-info { font-size: 0.85rem; color: var(--muted); margin-top: 10px; }

    /* Header de bienvenida */
    .welcome-header { font-size: 3rem; margin-bottom: 10px; }
    h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 20px; }

    /* Intentos fallidos */
    .attempt-counter { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }

    /* Loading spinner */
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #f3f3f3; border-top: 2px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. Pantalla de Clave -->
    <div id="screen-auth" class="screen active">
      <div class="welcome-header">✉️</div>
      <h1>Mensaje especial</h1>
      <p class="subtitle">Ingresa tu clave para abrir el mensaje:</p>
      <input type="text" id="input-clave" placeholder="Escribe tu clave..." autocomplete="off" />
      <button id="btn-unlock">Desbloquear</button>
      <div id="auth-error" class="error-msg"></div>
      <div class="attempt-counter" id="attempt-counter"></div>
    </div>

    <!-- 2. Pantalla de Bloqueo Global -->
    <div id="screen-locked" class="screen">
      <div class="welcome-header">🔒</div>
      <h1>Mensaje expirado</h1>
      <p class="subtitle">Este mensaje era de visualización única y ya ha sido completado.</p>
    </div>

    <!-- 3. Contenido en Scroll Continuo -->
    <div id="screen-content" class="screen"></div>
  </div>

  <script>
    // ==========================================
    // ⚙️ CONFIGURACIÓN DEL MENSAJE
    // ==========================================
    const MENSAJE_CONFIG = {
      titulo: "Mensaje especial",
      subtitulo: "Espero te guste 💝",
      notas: [
        {
          titulo: "Nota 1",
          contenido: "Quería escribirte esto para decirte algo que llevo tiempo pensando..."
        },
        {
          titulo: "Nota 2",
          contenido: "Cada momento contigo es único y valoro mucho tenerte en mi vida."
        },
        {
          titulo: "Nota 3",
          contenido: "Me gustas mucho y quería dar este paso de una forma especial."
        }
      ],
      tituloAudio: "Una canción para ti",
      textoAudio: "Escúchala hasta el final 🎵"
    };

    // ==========================================
    // 🔐 CREDENCIALES DE SUPABASE
    // ==========================================
    // ⚠️ IMPORTANTE: Usa la clave PÚBLICA (no la secreta)
    // En Supabase: Settings > API > Project API Keys > anon (public)
    const SUPABASE_URL = "https://txqgbyklrsddwgeaadkb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_e6ghzW3sfcGWHcaELhnjIg_hprebDft";
    
    // Inicializar cliente Supabase
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==========================================
    // 📝 ELEMENTOS DEL DOM
    // ==========================================
    const screenAuth = document.getElementById('screen-auth');
    const screenLocked = document.getElementById('screen-locked');
    const screenContent = document.getElementById('screen-content');
    const inputClave = document.getElementById('input-clave');
    const btnUnlock = document.getElementById('btn-unlock');
    const authError = document.getElementById('auth-error');
    const attemptCounter = document.getElementById('attempt-counter');

    // ==========================================
    // 🛡️ PROTECCIÓN CONTRA FUERZA BRUTA
    // ==========================================
    let intentosFallidos = 0;
    const MAX_INTENTOS = 5;
    const TIEMPO_BLOQUEO = 60000; // 1 minuto en milisegundos
    let bloqueado = false;

    // ==========================================
    // 🔓 EVENTO: DESBLOQUEAR
    // ==========================================
    btnUnlock.addEventListener('click', async () => {
      // Si está bloqueado, no hacer nada
      if (bloqueado) {
        mostrarError(`Espera un poco antes de intentar de nuevo.`);
        return;
      }

      const claveIngresada = inputClave.value.trim();
      
      // Validar que no esté vacío
      if (!claveIngresada) {
        mostrarError("Por favor ingresa una clave.");
        return;
      }

      // Mostrar estado de verificación
      btnUnlock.disabled = true;
      btnUnlock.innerHTML = '<div class="spinner"></div> Verificando...';
      authError.style.display = 'none';

      try {
        // 1. Consultar si la clave existe y NO ha sido usada
        const { data, error } = await supabase
          .from('claves')
          .select('*')
          .eq('clave', claveIngresada)
          .eq('usada', false)
          .single();

        if (error || !data) {
          // Clave inválida o ya utilizada
          intentosFallidos++;
          
          if (intentosFallidos >= MAX_INTENTOS) {
            // Bloquear después de X intentos
            bloqueado = true;
            btnUnlock.disabled = true;
            btnUnlock.innerText = "Bloqueado";
            mostrarError(`Demasiados intentos. Por favor intenta en 1 minuto.`);
            
            // Desbloquear después del tiempo especificado
            setTimeout(() => {
              bloqueado = false;
              intentosFallidos = 0;
              btnUnlock.disabled = false;
              btnUnlock.innerText = "Desbloquear";
              authError.style.display = 'none';
              attemptCounter.innerText = "";
            }, TIEMPO_BLOQUEO);
          } else {
            // Mostrar cuántos intentos quedan
            const intentosRestantes = MAX_INTENTOS - intentosFallidos;
            mostrarError(`Clave inválida o ya utilizada.`);
            attemptCounter.innerHTML = `<strong>Intentos restantes: ${intentosRestantes}/${MAX_INTENTOS}</strong>`;
            btnUnlock.disabled = false;
            btnUnlock.innerText = "Desbloquear";
          }
          return;
        }

        // 2. Clave válida: Quemar/invalidar inmediatamente
        await supabase
          .from('claves')
          .update({ usada: true, usada_en: new Date().toISOString() })
          .eq('clave', claveIngresada);

        // 3. Mostrar el contenido
        mostrarContenido();
        
      } catch (error) {
        console.error("Error al verificar clave:", error);
        mostrarError("Error de conexión. Intenta de nuevo.");
        btnUnlock.disabled = false;
        btnUnlock.innerText = "Desbloquear";
      }
    });

    // ==========================================
    // 📺 FUNCIÓN: Mostrar contenido desbloqueado
    // ==========================================
    function mostrarContenido() {
      screenAuth.classList.remove('active');
      screenContent.classList.add('active');

      // Limpiar contenido anterior
      screenContent.innerHTML = '';

      // Renderizar notas dinámicamente
      MENSAJE_CONFIG.notas.forEach((nota, index) => {
        const noteDiv = document.createElement('div');
        noteDiv.className = 'note';
        noteDiv.innerHTML = `
          <h2>${nota.titulo}</h2>
          <p>${nota.contenido}</p>
        `;
        screenContent.appendChild(noteDiv);
      });

      // Crear sección de audio
      const audioSection = document.createElement('div');
      audioSection.className = 'audio-section';
      audioSection.innerHTML = `
        <h2>${MENSAJE_CONFIG.tituloAudio}</h2>
        <p>${MENSAJE_CONFIG.textoAudio}</p>
        
        <div class="audio-input-group">
          <label for="audio-input">📁 Selecciona el archivo de audio:</label>
          <input type="file" id="audio-input" accept="audio/*" />
          <div id="audio-status" class="progress-info"></div>
        </div>
        
        <audio id="player" controls preload="none" style="display: none;"></audio>
        <div id="audio-placeholder" style="color: var(--muted); font-size: 0.9rem; padding: 20px;">
          Por favor sube un archivo de audio para continuar.
        </div>
      `;
      screenContent.appendChild(audioSection);

      // Configurar evento de subida de audio
      const audioInput = document.getElementById('audio-input');
      const audioPlayer = document.getElementById('player');
      const audioStatus = document.getElementById('audio-status');
      const audioPlaceholder = document.getElementById('audio-placeholder');

      audioInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        
        if (!file) return;

        // Validar que sea un archivo de audio
        if (!file.type.startsWith('audio/')) {
          audioStatus.innerHTML = '<span style="color: var(--primary);">❌ Por favor selecciona un archivo de audio válido.</span>';
          return;
        }

        // Validar tamaño (máximo 50MB)
        const maxSize = 50 * 1024 * 1024;
        if (file.size > maxSize) {
          audioStatus.innerHTML = '<span style="color: var(--primary);">❌ El archivo es muy grande (máximo 50MB).</span>';
          return;
        }

        // Crear URL del archivo y cargar el audio
        const url = URL.createObjectURL(file);
        audioPlayer.src = url;
        audioPlaceholder.style.display = 'none';
        audioPlayer.style.display = 'block';
        audioStatus.innerHTML = `<span style="color: var(--success);">✅ Audio cargado: ${file.name}</span>`;

        // Cuando termina el audio, bloquear
        audioPlayer.addEventListener('ended', bloquearPagina);
      });

      // Si en el futuro quieres una URL por defecto, descomenta esto:
      // audioPlayer.src = "cancion.mp3";
      // audioPlayer.style.display = 'block';
      // audioPlaceholder.style.display = 'none';
    }

    // ==========================================
    // 🔒 FUNCIÓN: Bloquear la página
    // ==========================================
    function bloquearPagina() {
      screenContent.classList.remove('active');
      screenLocked.classList.add('active');
    }

    // ==========================================
    // ⚠️ FUNCIÓN: Mostrar error
    // ==========================================
    function mostrarError(mensaje) {
      authError.innerHTML = `<strong>⚠️ ${mensaje}</strong>`;
      authError.style.display = 'block';
    }

    // ==========================================
    // ⌨️ EVENTO: Enter para desbloquear
    // ==========================================
    inputClave.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        btnUnlock.click();
      }
    });

  </script>
</body>
</html>
