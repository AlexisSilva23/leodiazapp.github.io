<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Un mensaje para ti</title>

</head>

<body>

  <div class="container">
    <!-- 1. Pantalla de Clave -->
    <div id="screen-auth" class="screen active">
      <div class="welcome-header">✉️</div>
      <h1>Mensaje especial</h1>
      <p class="subtitle">Ingresa tu clave para abrir el mensaje:</p>
      <input type="text" id="input-clave" placeholder="Escribe tu clave..." autocomplete="off" />
      <button id="btn-unlock">Desbloquear</button>
      <div id="auth-error" class="error-msg"></div>
      <div class="attempt-counter" id="attempt-counter"></div>
    </div>

    <!-- 2. Pantalla de Bloqueo Global -->
    <div id="screen-locked" class="screen">
      <div class="welcome-header">🔒</div>
      <h1>Mensaje expirado</h1>
      <p class="subtitle">Este mensaje era de visualización única y ya ha sido completado.</p>
    </div>

    <!-- 3. Contenido en Scroll Continuo -->
    <div id="screen-content" class="screen"></div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="function.js"></script>

</body>

</html>
